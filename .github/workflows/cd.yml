name: Deploy

on:
  workflow_run:
    workflows: [CI Workflow]
    types: [completed]
    branches:
      - 'main'

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Run Script
        run: |
          cd ~
          ./run.sh  # Run the script
